name: Deploy Health Link Ready Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: finalterm
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and server
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          test -d dist-server
          test -f dist-server/index.js
          node --check dist-server/index.js

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Verify runtime dependencies
        run: |
          test -d node_modules
          test -d node_modules/express
          test -d node_modules/dotenv
          npm list express --depth=0
          npm list dotenv --depth=0

      - name: Create deployment package
        run: |
          rm -rf release release.zip
          mkdir release

          cp package.json release/
          cp package-lock.json release/
          cp -r dist release/
          cp -r dist-server release/
          cp -r node_modules release/

          cd release
          zip -r ../release.zip .

      - name: Inspect deployment package
        run: |
          ls -lh release.zip
          unzip -l release.zip | head -100

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip